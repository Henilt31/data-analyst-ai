<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgE2E" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#080d1a" />
    </linearGradient>

    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 11px; fill: #f8fafc; text-anchor: middle; }
      .node-sub { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 9px; fill: #94a3b8; text-anchor: middle; }
      .step-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 10px; fill: #38bdf8; text-anchor: middle; }
      
      @keyframes dashflow {
        from { stroke-dashoffset: 40; }
        to { stroke-dashoffset: 0; }
      }

      @keyframes pulseLight {
        0%, 100% { fill-opacity: 0.15; stroke-opacity: 0.5; }
        50% { fill-opacity: 0.35; stroke-opacity: 1; }
      }

      .animated-flow {
        stroke-dasharray: 6, 4;
        animation: dashflow 1.5s linear infinite;
      }

      .pulse-1 { animation: pulseLight 3s ease-in-out infinite; animation-delay: 0.0s; }
      .pulse-2 { animation: pulseLight 3s ease-in-out infinite; animation-delay: 0.3s; }
      .pulse-3 { animation: pulseLight 3s ease-in-out infinite; animation-delay: 0.6s; }
      .pulse-4 { animation: pulseLight 3s ease-in-out infinite; animation-delay: 0.9s; }
      .pulse-5 { animation: pulseLight 3s ease-in-out infinite; animation-delay: 1.2s; }
      .pulse-6 { animation: pulseLight 3s ease-in-out infinite; animation-delay: 1.5s; }
      .pulse-7 { animation: pulseLight 3s ease-in-out infinite; animation-delay: 1.8s; }
      .pulse-8 { animation: pulseLight 3s ease-in-out infinite; animation-delay: 2.1s; }
      .pulse-9 { animation: pulseLight 3s ease-in-out infinite; animation-delay: 2.4s; }
      .pulse-10 { animation: pulseLight 3s ease-in-out infinite; animation-delay: 2.7s; }
    </style>
  </defs>

  <!-- Frame Background -->
  <rect width="1150" height="260" fill="url(#bgE2E)" rx="14" stroke="#334155" stroke-width="1.2" />

  <!-- Flow Track Line (Static Underlay) -->
  <path d="M 60 130 L 1090 130" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
  
  <!-- Flow Track Line (Animated Stream) -->
  <path d="M 60 130 L 1090 130" stroke="url(#flowGrad)" stroke-width="2.5" class="animated-flow" stroke-linecap="round" />

  <!-- 10 Sequential Stages Across the 1150px Width -->

  <!-- 1. Upload -->
  <g transform="translate(60, 130)">
    <circle cx="0" cy="0" r="28" fill="#0284c7" class="pulse-1" stroke="#38bdf8" stroke-width="2" />
    <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
    <text x="0" y="4" class="step-num">01</text>
    <text x="0" y="-38" class="node-title">UPLOAD</text>
    <text x="0" y="50" class="node-sub">CSV/JSON/Parquet</text>
  </g>

  <!-- 2. Profile -->
  <g transform="translate(170, 130)">
    <circle cx="0" cy="0" r="28" fill="#6366f1" class="pulse-2" stroke="#818cf8" stroke-width="2" />
    <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#818cf8" stroke-width="1" />
    <text x="0" y="4" class="step-num" fill="#818cf8">02</text>
    <text x="0" y="-38" class="node-title">PROFILE</text>
    <text x="0" y="50" class="node-sub">Deterministic Stats</text>
  </g>

  <!-- 3. Hypotheses -->
  <g transform="translate(280, 130)">
    <circle cx="0" cy="0" r="28" fill="#a855f7" class="pulse-3" stroke="#c084fc" stroke-width="2" />
    <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#c084fc" stroke-width="1" />
    <text x="0" y="4" class="step-num" fill="#c084fc">03</text>
    <text x="0" y="-38" class="node-title">QUESTIONS</text>
    <text x="0" y="50" class="node-sub">Grounded Hypotheses</text>
  </g>

  <!-- 4. RAG -->
  <g transform="translate(390, 130)">
    <circle cx="0" cy="0" r="28" fill="#ec4899" class="pulse-4" stroke="#f472b6" stroke-width="2" />
    <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#f472b6" stroke-width="1" />
    <text x="0" y="4" class="step-num" fill="#f472b6">04</text>
    <text x="0" y="-38" class="node-title">RAG RECALL</text>
    <text x="0" y="50" class="node-sub">Chroma Vector Index</text>
  </g>

  <!-- 5. Code Gen -->
  <g transform="translate(500, 130)">
    <circle cx="0" cy="0" r="28" fill="#3b82f6" class="pulse-5" stroke="#60a5fa" stroke-width="2" />
    <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#60a5fa" stroke-width="1" />
    <text x="0" y="4" class="step-num" fill="#60a5fa">05</text>
    <text x="0" y="-38" class="node-title">CODE GEN</text>
    <text x="0" y="50" class="node-sub">AST Checked Script</text>
  </g>

  <!-- 6. Sandbox -->
  <g transform="translate(620, 130)">
    <circle cx="0" cy="0" r="32" fill="#ef4444" class="pulse-6" stroke="#f87171" stroke-width="2.2" />
    <circle cx="0" cy="0" r="16" fill="#0f172a" stroke="#f87171" stroke-width="1" />
    <text x="0" y="4" class="step-num" fill="#f87171">06</text>
    <text x="0" y="-42" class="node-title" fill="#fca5a5">SANDBOX</text>
    <text x="0" y="54" class="node-sub" fill="#fca5a5">Isolated Execution</text>
  </g>

  <!-- 7. Result Parser -->
  <g transform="translate(740, 130)">
    <circle cx="0" cy="0" r="28" fill="#14b8a6" class="pulse-7" stroke="#2dd4bf" stroke-width="2" />
    <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#2dd4bf" stroke-width="1" />
    <text x="0" y="4" class="step-num" fill="#2dd4bf">07</text>
    <text x="0" y="-38" class="node-title">RESULT PARSER</text>
    <text x="0" y="50" class="node-sub">RESULT_JSON Lock</text>
  </g>

  <!-- 8. Insights -->
  <g transform="translate(850, 130)">
    <circle cx="0" cy="0" r="28" fill="#10b981" class="pulse-8" stroke="#34d399" stroke-width="2" />
    <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#34d399" stroke-width="1" />
    <text x="0" y="4" class="step-num" fill="#34d399">08</text>
    <text x="0" y="-38" class="node-title">INSIGHTS</text>
    <text x="0" y="50" class="node-sub">Grounded Evidence</text>
  </g>

  <!-- 9. Visuals -->
  <g transform="translate(960, 130)">
    <circle cx="0" cy="0" r="28" fill="#f59e0b" class="pulse-9" stroke="#fbbf24" stroke-width="2" />
    <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#fbbf24" stroke-width="1" />
    <text x="0" y="4" class="step-num" fill="#fbbf24">09</text>
    <text x="0" y="-38" class="node-title">VIZ BUILDER</text>
    <text x="0" y="50" class="node-sub">Plots &amp; Distribution</text>
  </g>

  <!-- 10. Report -->
  <g transform="translate(1070, 130)">
    <circle cx="0" cy="0" r="28" fill="#8b5cf6" class="pulse-10" stroke="#a78bfa" stroke-width="2" />
    <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#a78bfa" stroke-width="1" />
    <text x="0" y="4" class="step-num" fill="#a78bfa">10</text>
    <text x="0" y="-38" class="node-title">REPORT</text>
    <text x="0" y="50" class="node-sub">Synthesized Markdown</text>
  </g>
</svg>
