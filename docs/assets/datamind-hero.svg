<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0c1222" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="cardGradActive" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f2547" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.6" />
    </pattern>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; fill: #f8fafc; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 500; fill: #94a3b8; }
    .code-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 11px; fill: #cbd5e1; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 11px; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="480" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="480" fill="url(#grid)" rx="16" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="120" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glowFilter)" />
  <circle cx="980" cy="340" r="160" fill="#a855f7" opacity="0.10" filter="url(#glowFilter)" />
  <circle cx="600" cy="240" r="120" fill="#6366f1" opacity="0.08" filter="url(#glowFilter)" />

  <!-- Outer Border -->
  <rect x="1" y="1" width="1198" height="478" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" rx="16" />

  <!-- Hero Header -->
  <g transform="translate(60, 55)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="220" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="12" cy="13" r="4" fill="#38bdf8" />
    <text x="24" y="17" class="badge-text" fill="#38bdf8">LOCAL-FIRST AUTONOMOUS EDA</text>

    <!-- Main Title -->
    <text x="0" y="68" class="title" font-size="44" letter-spacing="-0.02em">
      DataMind <tspan fill="url(#primaryGlow)">Autonomous Engine</tspan>
    </text>
    <text x="0" y="100" class="subtitle" font-size="16">
      Self-Correcting, RAG-Augmented Exploratory Data Analysis &amp; Report Synthesis
    </text>
  </g>

  <!-- Interactive Workflow Pipeline Visual -->
  <g transform="translate(60, 195)">
    <!-- Stage 1: Ingestion -->
    <g transform="translate(0, 0)">
      <rect width="150" height="210" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <rect x="12" y="14" width="28" height="28" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" />
      <path d="M 22 23 L 26 19 L 30 23 M 26 19 L 26 31" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" />
      <text x="48" y="32" class="title" font-size="13">Ingestion</text>
      <text x="14" y="62" class="code-text" fill="#94a3b8">• Multi-format</text>
      <text x="22" y="78" class="code-text" fill="#38bdf8">CSV, Parquet</text>
      <text x="22" y="94" class="code-text" fill="#38bdf8">JSON, Excel</text>
      <text x="14" y="120" class="code-text" fill="#94a3b8">• Validation</text>
      <text x="22" y="136" class="code-text" fill="#64748b">Size Quotas</text>
      <text x="22" y="152" class="code-text" fill="#64748b">Type Detection</text>
      <rect x="12" y="174" width="126" height="22" rx="4" fill="#0f172a" stroke="#1e293b" />
      <text x="20" y="189" class="code-text" font-size="10" fill="#38bdf8">Zero Cloud Egress</text>
    </g>

    <!-- Connector 1 -->
    <path d="M 152 105 L 176 105" stroke="#475569" stroke-width="2" stroke-dasharray="3,3" />

    <!-- Stage 2: Profiler -->
    <g transform="translate(180, 0)">
      <rect width="150" height="210" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <rect x="12" y="14" width="28" height="28" rx="6" fill="#6366f1" fill-opacity="0.2" stroke="#818cf8" stroke-width="1" />
      <path d="M 20 28 L 24 22 L 28 26 L 33 20" fill="none" stroke="#818cf8" stroke-width="1.8" stroke-linecap="round" />
      <text x="48" y="32" class="title" font-size="13">Profiling</text>
      <text x="14" y="62" class="code-text" fill="#94a3b8">• Deterministic</text>
      <text x="22" y="78" class="code-text" fill="#818cf8">Schema &amp; Dtypes</text>
      <text x="22" y="94" class="code-text" fill="#818cf8">Null Metrics</text>
      <text x="14" y="120" class="code-text" fill="#94a3b8">• Signals</text>
      <text x="22" y="136" class="code-text" fill="#64748b">Correlations</text>
      <text x="22" y="152" class="code-text" fill="#64748b">Data Quality</text>
      <rect x="12" y="174" width="126" height="22" rx="4" fill="#0f172a" stroke="#1e293b" />
      <text x="20" y="189" class="code-text" font-size="10" fill="#818cf8">NumPy / Pandas</text>
    </g>

    <!-- Connector 2 -->
    <path d="M 332 105 L 356 105" stroke="#475569" stroke-width="2" stroke-dasharray="3,3" />

    <!-- Stage 3: Question Gen + RAG -->
    <g transform="translate(360, 0)">
      <rect width="155" height="210" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <rect x="12" y="14" width="28" height="28" rx="6" fill="#a855f7" fill-opacity="0.2" stroke="#c084fc" stroke-width="1" />
      <circle cx="26" cy="28" r="5" fill="none" stroke="#c084fc" stroke-width="1.8" />
      <path d="M 29 32 L 34 37" stroke="#c084fc" stroke-width="1.8" stroke-linecap="round" />
      <text x="48" y="32" class="title" font-size="13">Hypotheses</text>
      <text x="14" y="62" class="code-text" fill="#94a3b8">• Grounded LLM</text>
      <text x="22" y="78" class="code-text" fill="#c084fc">Strict Schemas</text>
      <text x="22" y="94" class="code-text" fill="#c084fc">Column Locks</text>
      <text x="14" y="120" class="code-text" fill="#94a3b8">• Chroma RAG</text>
      <text x="22" y="136" class="code-text" fill="#64748b">Structural Match</text>
      <text x="22" y="152" class="code-text" fill="#64748b">384-d Vectors</text>
      <rect x="12" y="174" width="131" height="22" rx="4" fill="#0f172a" stroke="#1e293b" />
      <text x="18" y="189" class="code-text" font-size="10" fill="#c084fc">Cross-Dataset RAG</text>
    </g>

    <!-- Connector 3 -->
    <path d="M 517 105 L 541 105" stroke="#475569" stroke-width="2" stroke-dasharray="3,3" />

    <!-- Stage 4: LangGraph Self-Correction Sandbox -->
    <g transform="translate(545, 0)">
      <rect width="185" height="210" rx="12" fill="url(#cardGradActive)" stroke="#38bdf8" stroke-width="1.5" />
      <rect x="12" y="14" width="28" height="28" rx="6" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.2" />
      <path d="M 20 28 L 26 34 L 33 22" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <text x="48" y="32" class="title" font-size="13" fill="#38bdf8">LangGraph Loop</text>
      <text x="14" y="62" class="code-text" fill="#94a3b8">• Isolated Sandbox</text>
      <text x="22" y="78" class="code-text" fill="#38bdf8">Network Blocked</text>
      <text x="22" y="94" class="code-text" fill="#38bdf8">Secrets Scrubbed</text>
      <text x="14" y="120" class="code-text" fill="#94a3b8">• Self-Correction</text>
      <text x="22" y="136" class="code-text" fill="#f43f5e">Traceback Repair</text>
      <text x="22" y="152" class="code-text" fill="#34d399">Max Retries: 3</text>
      <rect x="12" y="174" width="161" height="22" rx="4" fill="#0b1e36" stroke="#0284c7" />
      <text x="18" y="189" class="code-text" font-size="10" fill="#38bdf8">Autonomous Healing</text>
    </g>

    <!-- Connector 4 -->
    <path d="M 732 105 L 756 105" stroke="#475569" stroke-width="2" stroke-dasharray="3,3" />

    <!-- Stage 5: Grounded Parser & Viz -->
    <g transform="translate(760, 0)">
      <rect width="155" height="210" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <rect x="12" y="14" width="28" height="28" rx="6" fill="#10b981" fill-opacity="0.2" stroke="#34d399" stroke-width="1" />
      <circle cx="26" cy="28" r="6" fill="#34d399" fill-opacity="0.5" />
      <text x="48" y="32" class="title" font-size="13">Grounded Viz</text>
      <text x="14" y="62" class="code-text" fill="#94a3b8">• RESULT_JSON</text>
      <text x="22" y="78" class="code-text" fill="#34d399">Zero Inventions</text>
      <text x="22" y="94" class="code-text" fill="#34d399">Evidence Locks</text>
      <text x="14" y="120" class="code-text" fill="#94a3b8">• Visualizations</text>
      <text x="22" y="136" class="code-text" fill="#64748b">Matplotlib Plots</text>
      <text x="22" y="152" class="code-text" fill="#64748b">Seaborn Charts</text>
      <rect x="12" y="174" width="131" height="22" rx="4" fill="#0f172a" stroke="#1e293b" />
      <text x="18" y="189" class="code-text" font-size="10" fill="#34d399">Proven Statistics</text>
    </g>

    <!-- Connector 5 -->
    <path d="M 917 105 L 941 105" stroke="#475569" stroke-width="2" stroke-dasharray="3,3" />

    <!-- Stage 6: Final Synthesis -->
    <g transform="translate(945, 0)">
      <rect width="135" height="210" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <rect x="12" y="14" width="28" height="28" rx="6" fill="#e11d48" fill-opacity="0.2" stroke="#fb7185" stroke-width="1" />
      <path d="M 20 22 L 32 22 M 20 28 L 32 28 M 20 34 L 28 34" stroke="#fb7185" stroke-width="1.8" stroke-linecap="round" />
      <text x="48" y="32" class="title" font-size="13">Report</text>
      <text x="14" y="62" class="code-text" fill="#94a3b8">• Markdown Doc</text>
      <text x="22" y="78" class="code-text" fill="#fb7185">Exec Summary</text>
      <text x="22" y="94" class="code-text" fill="#fb7185">Key Takeaways</text>
      <text x="14" y="120" class="code-text" fill="#94a3b8">• Telemetry</text>
      <text x="22" y="136" class="code-text" fill="#64748b">Trial Logging</text>
      <text x="22" y="152" class="code-text" fill="#64748b">WebSocket WS</text>
      <rect x="12" y="174" width="111" height="22" rx="4" fill="#0f172a" stroke="#1e293b" />
      <text x="18" y="189" class="code-text" font-size="10" fill="#fb7185">Ready Artifact</text>
    </g>
  </g>
</svg>
